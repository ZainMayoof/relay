      },
      "TypeCreate": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "category": {
            "type": "string",
            "minLength": 1
          },
          "description": {
            "type": "string"
          },
          "specifications": {
            "type": "object",
            "description": "JSON object, maximum nesting depth 10. Keys beginning with $, containing dots, or named __proto__, constructor or prototype are rejected."
