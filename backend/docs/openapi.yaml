{
  "openapi": "3.0.3",
  "info": {
    "title": "Relay API",
    "version": "1.0.0",
    "description": "Documents the existing 24 Relay operations. HTTPS and same-origin browser access are required for secure cookie sessions. Swagger cannot set HttpOnly cookies manually through Authorize. Log in through the same HTTPS origin; browsers manage cookies. Local HTTP, another origin or a proxy mismatch can prevent Try it out. No security bypass is provided."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "tags": [
    {
      "name": "Authentication"
    },
    {
      "name": "Equipment Catalog"
    },
    {
      "name": "Equipment Inventory"
    },
    {
      "name": "Borrowing & Reservations"
    },
    {
      "name": "Administration & Auditing"
    }
  ],
