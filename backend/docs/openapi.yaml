        "tags": [
          "Authentication"
        ],
        "summary": "Authenticate and establish a session",
        "description": "Required role: Public. Email is trimmed and lowercased. Inactive and placeholder accounts cannot log in. Sets a Secure, HttpOnly, SameSite=Strict cookie. Requires an Origin header exactly matching APP_ORIGIN. Unknown query parameters are rejected; query parameters must be single values.",
        "security": [],
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Profile"
                }
              }
            }
          },
          "400": {
            "description": "Invalid fields, identifiers, query or JSON",
